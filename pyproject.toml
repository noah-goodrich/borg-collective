# borg-collective is a zsh CLI, not a distributable Python package (no [build-system]/[project] --
# there is nothing to build). This toolchain (ruff/mypy/pylint/pytest/coverage below, plus a PEP 735
# dependency group installed via `pip install --group dev`, pip>=25.1) is scoped to `borg_core/`,
# the Python core the python-core-and-toolchain directive's Part 3 builds. merge-tree/ and
# docs/infoviz/harness/ belong to a separate program (the viz/infoviz work) and are deliberately
# NOT covered here -- see the directive's Scope Boundaries. `borg_core/` does not exist yet until
# Part 3's first commit; `make lint`/`make test` no-op gracefully until then (see Makefile).

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "coverage>=6.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pylint>=2.15.0",
    "pylint-clean-architecture==1.5.2",
    "import-linter>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["borg_core"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Exclude functional tests from default runs (they're slow)
norecursedirs = ["tests/functional"]
addopts = [
    "--strict-markers",
]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (may require external services)",
    "functional: Functional tests (end-to-end workflows, slow)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[tool.pylint.main]
load-plugins = ["clean_architecture_linter"]
# Test files are the callers exercising private/internal functions by design (e.g. cli._run,
# cli._die) and are exempt from docstring/fixture-shadowing style rules that make sense for
# production code but not for pytest test modules.
ignore-patterns = ["test_.*\\.py$"]

[tool.pylint.format]
max-line-length = 120

# R0801 fired on Phase 2's link/cli.py: "Similar lines in 2 files ==borg_core.link.cli:[110:117]
# ==borg_core.registry.cli:[103:110]" -- the try/except ValueError + raise SystemExit + __main__
# shape every borg_core cli.py's main() shares (registry/cli.py, recon/cli.py, link/cli.py). Same
# cause each of the three times it can fire; raised to 8 so it stops re-flagging that one shape.
[tool.pylint.similarities]
min-similarity-lines = 8

[tool.clean-arch]
project_type = "generic"
visibility_enforcement = true
project_name = "BORG"
color = "green"
welcome_msg = "The Collective Lints"
allowed_prefixes = ["borg_core", "__future__"]

# `grid.py` is named here for the same reason `core.py` is: it is PURE domain logic (the manifest
# grid and the swept > declared > unknown resolve ladder) and must stay that way -- no os, no
# subprocess, no environment, no clock, no filesystem. It was extracted FROM borg_core/link/core.py
# when S3's sweep fold pushed that module past pylint's 1000-line ceiling; adding the name here is
# what keeps the extraction from being an escape from the Domain rules it used to sit under. Any
# future pure-logic module split out of a core.py belongs on this list on the same terms.
[tool.clean-arch.module_map]
Domain = ["core.py", "grid.py"]

[tool.coverage.run]
source = ["borg_core"]
branch = true
omit = [
    "*/test_*.py",
]
