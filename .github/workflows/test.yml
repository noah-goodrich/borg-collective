name: Test

# Two lanes, deliberately. See tests/README.md for what each one proves.
#   fast lane  — ubuntu, full bats suite. Cannot catch zsh-specific or BSD-specific bugs.
#   fidelity   — macOS, contract suite only. Catches the bug classes the fast lane structurally
#                cannot, at ~12 tests' worth of 10x-billed runner minutes instead of 530.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # D4: re-test main independently of PR activity. main went red on 2026-08-10 and stayed red for
    # hours because nothing re-ran it. A scheduled run makes Noah the actor of record, so GitHub's
    # own failure email fires.
    - cron: '17 13 * * *'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      # D2: was `shellcheck hooks/*.sh` only. lib/*.sh was UNLINTED — and lib/recon.sh is exactly
      # where both #113 bugs lived. shellcheck cannot check the .zsh files at all (its maintainer
      # has declined zsh support since 2016; forcing `-s bash` is documented as giving false safety
      # on precisely the word-splitting class that caused #113), so .zsh is intentionally excluded
      # rather than checked misleadingly.
      # evals/*/run.sh joined the gate 2026-09-02. It was the one script a CI job would execute
      # that no linter checked, and it had been dead on arrival for its whole life -- a hardcoded
      # /Users/noah prefix, and no `set -e`, so the failing prologue was invisible and every case
      # reported FAIL for never having run. Verified rc=0 over hooks + lib + evals before landing.
      - name: Lint portable sh (hooks + lib + evals)
        run: shellcheck hooks/*.sh lib/*.sh evals/*/run.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get install -y zsh jq fzf
      # D3: was `git clone --depth 1 ... master` — completely unpinned, so the harness could change
      # under us with no signal in this repo. Pinned to a released action version.
      - name: Setup bats
        uses: bats-core/bats-action@4.0.0
      - name: Run full suite
        run: bats tests/*.bats

  python:
    # T4 (python-core-and-toolchain directive, Part 1): pinned to the Python version installed on
    # both of Noah's machines (3.14.x), single version deliberately — borg ships to nobody and runs
    # on two known machines, not a matrix. Runs the exact `make lint`/`make test` targets used
    # locally so CI and local can never drift the way the 161-assertion bats bug did.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dev toolchain
        run: pip install --group dev
      - name: Lint (ruff + mypy + pylint w/ clean-architecture plugin)
        run: make lint
      - name: Test + coverage baseline
        run: make test


  viz:
    # The infoviz program (merge-tree/) has its own gate, deliberately separate from the `python`
    # job above. borg_core/ is held to a 90% floor with clean-architecture enforcement; merge-tree/
    # is a renderer program with a different shape and its own coverage reality.
    #
    # This job exists because "out of scope" had silently become "ungated". merge-tree/ carried 124
    # passing tests from the python-core-and-toolchain directive's Part 2 -- curate.py at 99%,
    # render_graph.py at 88% -- but `testpaths = ["borg_core"]` meant pytest never collected them.
    # They were written, committed, and then never run by anything. A regression in the infoviz
    # renderer would have shipped green.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dev toolchain
        run: pip install --group dev
      - name: Lint viz program (ruff)
        run: make lint-viz
      - name: Test viz program + coverage floor
        run: make test-viz

  contract-macos:
    # B3: the fidelity lane. macOS runners bill ~10x ubuntu minutes, so this runs ONLY the contract
    # suite (~12 subprocess tests), not the full 530. This is the only job that executes borg.zsh
    # under a real zsh on a real BSD userland — the two conditions under which #113 and #114 were
    # invisible.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install jq
      - name: Setup bats
        uses: bats-core/bats-action@4.0.0
      - name: Run CLI contract suite
        run: bats tests/cli_contract.bats
